# =============================================================================
# arXiv Daily Paper Fetcher — Configuration
# =============================================================================
# 调研方向（2026-08 起）: 工具调用 (Tool Calling / Tool Use) + OPD (On-Policy
# Distillation，含 LLM 蒸馏与智能体蒸馏)

# --- Query Groups ----------------------------------------------------------
# Each group: keywords (arXiv boolean syntax) + target categories + label

queries:
  # Tool calling / function calling
  - label: "Tool Calling & Tool Use (cs.AI/cs.CL/cs.LG)"
    keywords: >
      (
        "tool+use"
        +OR+
        "tool-use"
        +OR+
        "tool+calling"
        +OR+
        "function+calling"
        +OR+
        "API+calling"
        +OR+
        "tool+learning"
        +OR+
        "tool+selection"
        +OR+
        "tool+creation"
      )
    categories:
      - cs.AI
      - cs.CL
      - cs.LG

  # On-policy / knowledge distillation for LLMs
  - label: "On-Policy Distillation & LLM Distillation (cs.CL/cs.LG/cs.AI)"
    keywords: >
      (
        "on-policy+distillation"
        +OR+
        ("knowledge+distillation"+AND+("LLM"+OR+"large+language+model"))
        +OR+
        ("distillation"+AND+("LLM"+OR+"language+model"))
        +OR+
        ("distilling"+AND+("LLM"+OR+"large+language+model"))
      )
    categories:
      - cs.CL
      - cs.LG
      - cs.AI

  # Distillation × agent / multi-turn (OPD for agents, e.g. Guided-OPD)
  - label: "Agent Distillation (distill × agent/multi-turn/tool)"
    keywords: >
      (
        ("distillation"+OR+"distilling")
        +AND+
        ("multi-turn"+OR+"agentic"+OR+"agent"+OR+"tool+use")
      )
    categories:
      - cs.AI
      - cs.CL
      - cs.LG

# --- Scoring Rules ---------------------------------------------------------
# Positive signals. field: "title" (full weight) or "abstract" (half weight)

score_rules:
  # Highest priority: core topics in title
  - keywords:
      - "tool use"
      - "tool-use"
      - "tool calling"
      - "function calling"
      - "tool learning"
      - "tool selection"
      - "tool creation"
    weight: 3
    field: title

  - keywords:
      - "on-policy distillation"
    weight: 3
    field: title

  # Medium priority: related topics in title
  - keywords:
      - "distillation"
      - "distilling"
      - "knowledge distillation"
    weight: 2
    field: title

  - keywords:
      - "agent"
      - "agentic"
      - "multi-turn"
      - "LLM agent"
    weight: 2
    field: title

  - keywords:
      - "large language model"
      - "LLM"
      - "foundation model"
    weight: 2
    field: title

  # Lower priority: abstract matches (weights halved automatically)
  - keywords:
      - "tool use"
      - "tool calling"
      - "function calling"
      - "on-policy distillation"
      - "distillation"
      - "agent"
      - "multi-turn"
    weight: 2
    field: abstract

  - keywords:
      - "on-policy"
      - "API"
      - "function call"
    weight: 1
    field: title

# --- Exclusion Rules -------------------------------------------------------
# Papers matching any of these are filtered OUT

exclude_rules:
  # Biological / Chemical agents
  - keywords:
      - "molecular agent"
      - "drug agent"
      - "therapeutic agent"
      - "anticancer"
      - "antibacterial"
      - "cell agent"
      - "protein agent"
      - "chemical agent"
      - "biological agent"
    field: title

  # Non-CS domains
  - keywords:
      - "economic agent"
      - "trading agent"
    field: title

  # Hardware / IoT
  - keywords:
      - "wireless sensor"
      - "IoT device"
      - "embedded agent"
    field: title

  # CV-domain distillation noise (query leakage via abstract mentioning LLM)
  - keywords:
      - "semantic segmentation"
      - "object detection"
      - "image classification"
      - "point cloud"
    field: title
